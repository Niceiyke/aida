[package]
name = "studio"
version = "0.1.0"
edition = "2024"
description = "A local-first, headless AI video studio"
license = "UNLICENSED"

[dependencies]
anyhow = "1.0"
axum = "0.8"
command-group = "5.0.1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
jsonschema = { version = "0.61.2", default-features = false }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
uuid = { version = "1.8", features = ["v4"] }

[dev-dependencies]
tempfile = "3.10"
tower = { version = "0.5", features = ["util"] }
